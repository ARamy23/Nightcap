name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Domain unit tests (SwiftPM)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run domain tests
        working-directory: Packages/NightcapDomain
        run: swift test

      - name: Check domain coverage
        run: ./scripts/check-domain-coverage.sh 80

      - name: Run menu bar snapshot tests
        working-directory: Packages/NightcapUI
        run: swift test

  test:
    name: Build and Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Nightcap.xcodeproj \
            -scheme Nightcap

      - name: Build (Debug, no signing)
        run: |
          xcodebuild build \
            -project Nightcap.xcodeproj \
            -scheme Nightcap \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project Nightcap.xcodeproj \
            -scheme Nightcap \
            -destination 'platform=macOS,arch=arm64' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult

      - name: Check domain coverage
        run: ./scripts/check-domain-coverage.sh 80

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7

  companions:
    name: Companion apps
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build iPhone app
        run: |
          xcodebuild build \
            -project Nightcap.xcodeproj \
            -scheme NightcapPhone \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Build watch app
        run: |
          xcodebuild build \
            -project Nightcap.xcodeproj \
            -scheme NightcapWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Snapshot tests
        run: |
          xcodebuild test \
            -project Nightcap.xcodeproj \
            -scheme NightcapPhone \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath PhoneTestResults.xcresult

      - name: Upload phone test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-test-results
          path: PhoneTestResults.xcresult
          retention-days: 7

  e2e:
    name: Maestro e2e
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Generate Xcode project
        run: xcodegen

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl create maestro-iphone \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16)
          xcrun simctl boot "$UDID"
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV

      - name: Build and install app
        run: |
          xcodebuild build \
            -project Nightcap.xcodeproj \
            -scheme NightcapPhone \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
          xcrun simctl install "$SIM_UDID" \
            DerivedData/Build/Products/Debug-iphonesimulator/Nightcap.app

      - name: Run Maestro flows
        run: maestro test .maestro/

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: ~/.maestro/tests
          retention-days: 7
