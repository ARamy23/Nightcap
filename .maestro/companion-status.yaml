# Verifies the companion's core promise end to end: it shows what the Mac is
# doing, and pausing an app from the phone releases the Mac.
appId: com.abdocodes.nightcap.phone
---
- launchApp:
    clearState: true

# The first snapshot arrives asynchronously after onAppear subscribes, so wait
# for it rather than asserting into an empty screen.
- extendedWaitUntil:
    visible: "Keeping Mac Awake. 1 app active"
    timeout: 10000

- assertVisible: "Watched Apps"
- assertVisible: "Ghostty"
- assertVisible: "Xcode"

# A paused app is labelled as such rather than silently shown as off
- assertVisible: "zoom.us"
- assertVisible: "Paused"

# Pausing Ghostty from the phone lets the Mac sleep
- tapOn: "Watch Ghostty"
- extendedWaitUntil:
    visible: "Idle. Sleep allowed"
    timeout: 10000

# Resuming brings the app back into the list as watched
- tapOn: "Watch Ghostty"
- assertVisible: "Ghostty"
