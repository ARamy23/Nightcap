name: Nightcap

options:
  bundleIdPrefix: com.abdocodes
  deploymentTarget:
    macOS: 14.0

packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: 1.0.0
  swift-dependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    from: 1.12.0
  swift-snapshot-testing:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0
  swift-sharing:
    url: https://github.com/pointfreeco/swift-sharing
    from: 2.8.0
  swift-case-paths:
    url: https://github.com/pointfreeco/swift-case-paths
    from: 1.7.2
  swift-concurrency-extras:
    url: https://github.com/pointfreeco/swift-concurrency-extras
    from: 1.3.2
  swift-perception:
    url: https://github.com/pointfreeco/swift-perception
    from: 2.0.9
  xctest-dynamic-overlay:
    url: https://github.com/pointfreeco/xctest-dynamic-overlay
    from: 1.9.0
  swift-custom-dump:
    url: https://github.com/pointfreeco/swift-custom-dump
    from: 1.5.0
  swift-identified-collections:
    url: https://github.com/pointfreeco/swift-identified-collections
    from: 1.1.1
  swift-navigation:
    url: https://github.com/pointfreeco/swift-navigation
    from: 2.7.0
  swift-clocks:
    url: https://github.com/pointfreeco/swift-clocks
    from: 1.0.6
  combine-schedulers:
    url: https://github.com/pointfreeco/combine-schedulers
    from: 1.1.0

targets:
  Nightcap:
    type: application
    platform: macOS
    deploymentTarget: 14.0
    info:
      path: Nightcap/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Nightcap
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Abdo Eaita. All rights reserved."
    entitlements:
      path: Nightcap/Nightcap.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    sources:
      - path: Nightcap
    dependencies:
      - target: NightcapDomain_macOS
      - target: NightcapClients
      - target: NightcapUI
      - package: ComposableArchitecture
      - package: swift-dependencies
        product: Dependencies
      - package: swift-dependencies
        product: DependenciesMacros
      - package: swift-sharing
        product: Sharing
      - package: swift-case-paths
        product: CasePaths
      - package: swift-case-paths
        product: CasePathsCore
      - package: swift-concurrency-extras
        product: ConcurrencyExtras
      - package: swift-perception
        product: Perception
      - package: swift-perception
        product: PerceptionCore
      - package: xctest-dynamic-overlay
        product: IssueReporting
      - package: swift-custom-dump
        product: CustomDump
      - package: swift-identified-collections
        product: IdentifiedCollections
      - package: swift-navigation
        product: SwiftNavigation
      - package: combine-schedulers
        product: CombineSchedulers
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 2
        DEVELOPMENT_TEAM: 85R85ZNGEX
        MARKETING_VERSION: 1.0
        PRODUCT_BUNDLE_IDENTIFIER: com.abdocodes.nightcap
        SWIFT_VERSION: 5.0
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  NightcapDomain:
    type: framework
    platform: [macOS, iOS, watchOS]
    deploymentTarget:
      macOS: 14.0
      iOS: 17.0
      watchOS: 10.0
    sources:
      - path: Packages/NightcapDomain/Sources/NightcapDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdocodes.nightcap.domain
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        # Static: avoids embedding/signing three dynamic frameworks and the
        # duplicate-symbol problems from mixing them with SPM PackageFrameworks.
        MACH_O_TYPE: staticlib
        SKIP_INSTALL: YES
    dependencies:
      - package: ComposableArchitecture
      - package: swift-dependencies
        product: Dependencies
      - package: swift-dependencies
        product: DependenciesMacros
      - package: swift-sharing
        product: Sharing
      - package: swift-case-paths
        product: CasePaths
      - package: swift-case-paths
        product: CasePathsCore
      - package: swift-concurrency-extras
        product: ConcurrencyExtras
      - package: swift-perception
        product: Perception
      - package: swift-perception
        product: PerceptionCore
      - package: xctest-dynamic-overlay
        product: IssueReporting
      - package: swift-custom-dump
        product: CustomDump
      - package: swift-identified-collections
        product: IdentifiedCollections
      - package: swift-navigation
        product: SwiftNavigation
      - package: combine-schedulers
        product: CombineSchedulers

  NightcapClients:
    type: framework
    platform: macOS
    deploymentTarget: 14.0
    sources:
      - path: Packages/NightcapClients/Sources/NightcapClients
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdocodes.nightcap.clients
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        # Static: avoids embedding/signing three dynamic frameworks and the
        # duplicate-symbol problems from mixing them with SPM PackageFrameworks.
        MACH_O_TYPE: staticlib
        SKIP_INSTALL: YES
    dependencies:
      - target: NightcapDomain_macOS
      - package: swift-dependencies
        product: Dependencies

  NightcapUI:
    type: framework
    platform: macOS
    deploymentTarget: 14.0
    sources:
      - path: Packages/NightcapUI/Sources/NightcapUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdocodes.nightcap.ui
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        # Static: avoids embedding/signing three dynamic frameworks and the
        # duplicate-symbol problems from mixing them with SPM PackageFrameworks.
        MACH_O_TYPE: staticlib
        SKIP_INSTALL: YES
    dependencies:
      - target: NightcapDomain_macOS
      - package: ComposableArchitecture

  NightcapCompanionUI:
    type: framework
    platform: [iOS, watchOS]
    deploymentTarget:
      iOS: 17.0
      watchOS: 10.0
    sources:
      - path: Packages/NightcapCompanionUI/Sources/NightcapCompanionUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdocodes.nightcap.companionui
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        MACH_O_TYPE: staticlib
        SKIP_INSTALL: YES
    dependencies:
      - target: NightcapDomain_${platform}
      - package: ComposableArchitecture
        link: false

  NightcapPhone:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: Apps/Phone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdocodes.nightcap.phone
        PRODUCT_NAME: Nightcap
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nightcap
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: NightcapDomain_iOS
      - target: NightcapCompanionUI_iOS
      - package: ComposableArchitecture
        link: false

  NightcapWatch:
    type: application
    platform: watchOS
    deploymentTarget: 10.0
    sources:
      - path: Apps/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdocodes.nightcap.watch
        PRODUCT_NAME: Nightcap
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nightcap
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: NightcapDomain_watchOS
      - target: NightcapCompanionUI_watchOS
      - package: ComposableArchitecture
        link: false

  NightcapPhoneTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: Tests/PhoneTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.abdocodes.nightcap.phone.tests
        SWIFT_VERSION: 5.0
    dependencies:
      - target: NightcapPhone
      - target: NightcapDomain_iOS
      - target: NightcapCompanionUI_iOS
      - package: ComposableArchitecture
        link: false
      - package: swift-snapshot-testing
        product: SnapshotTesting

  NightcapTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: 14.0
    sources:
      - path: NightcapTests
    dependencies:
      - target: Nightcap
      - target: NightcapDomain_macOS
      - package: ComposableArchitecture
      - package: swift-dependencies
        product: Dependencies
      - package: swift-dependencies
        product: DependenciesMacros
      - package: swift-sharing
        product: Sharing
      - package: swift-concurrency-extras
        product: ConcurrencyExtras
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.abdocodes.nightcap.tests
        SWIFT_VERSION: 5.0
